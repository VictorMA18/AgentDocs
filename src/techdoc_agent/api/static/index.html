<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechDoc Agent</title>
  <link rel="stylesheet" href="/static/app.css">
  <!-- Librerías con versión fija y hash SRI. El navegador rechaza el archivo si cambia un solo byte. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js"
          integrity="sha384-2vpGtuKqJvFlwJqYnf/wUMuzUfhUnYBt9oay0e2yaFcq0Dh6/aEbQ8YAOeKGzlYo"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"
          integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js"
          integrity="sha384-EOXBFmc3gx5mb+vn0vPvvGqACToJD24hhacX5Yx+8NUUQrHIle/Qi5Bg9o3zKwW2"
          crossorigin="anonymous"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app">
    <details class="side docs" id="docs-panel" open>
      <summary>Documentos</summary>
      <div class="side-body">
        <label class="drop" id="drop" for="file-input">
          <span class="drop-title">Subir documento</span>
          <span class="drop-hint" id="drop-hint">Arrastra un archivo o haz clic</span>
          <input type="file" id="file-input">
        </label>
        <p class="status" id="doc-status" role="status" aria-live="polite"></p>
        <ul class="doc-list" id="doc-list" aria-label="Documentos indexados"></ul>
        <p class="empty" id="doc-empty" hidden>Aún no hay documentos indexados.</p>
      </div>
    </details>

    <main class="chat">
      <header class="chat-head">
        <h1>TechDoc Agent</h1>
        <button type="button" class="ghost" id="new-chat">Nueva conversación</button>
      </header>
      <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Conversación">
        <p class="empty" id="chat-empty">Sube un documento y pregunta sobre él. También puedes pedir un diagrama o los requisitos de una sección.</p>
      </div>
      <form class="composer" id="chat-form">
        <label class="sr-only" for="message">Mensaje</label>
        <textarea id="message" rows="2" maxlength="8000" placeholder="Escribe tu pregunta. Enter envía, Shift+Enter añade una línea." required></textarea>
        <button type="submit" id="send">Enviar</button>
      </form>
    </main>

    <details class="side trace" id="trace-panel" open>
      <summary>Pasos del agente</summary>
      <div class="side-body">
        <p class="empty" id="trace-empty">Aquí verás las herramientas que usa el agente en cada respuesta.</p>
        <ol class="turns" id="turns"></ol>
      </div>
    </details>
  </div>
</body>
</html>
