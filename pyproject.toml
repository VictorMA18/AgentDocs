[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "techdoc-agent"
version = "0.1.0"
description = "Agente de documentación técnica con RAG como herramienta, diagramas Mermaid y requisitos."
requires-python = ">=3.11"
# Las dependencias se gestionan en requirements.txt (se instalan por fases).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]  # `from fakes import ...` y `import evals`
